proxy-groups:
  - name: AUTO
    type: url-test
    include-all-providers: true
    url: https://www.gstatic.com/generate_204
    interval: 120
    timeout: 4000
    tolerance: 50
    lazy: false
    max-failed-times: 3
    expected-status: 204
    exclude-filter: "(?i)expire|expiring|traffic|remain|剩余|流量|过期|官网|套餐|到期|重置|订阅"

  # - name: FALLBACK
  #   type: fallback
