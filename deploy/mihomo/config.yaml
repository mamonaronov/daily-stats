proxy-groups:
  - name: AUTO
    type: fallback
    # sub3 first: curated ~150. sub4/sub5 are whitelist — they look fast on
    # Google/DPI and cannot carry Bot API; keep them off the bot path.
    use:
      - sub3
      - sub1
      - sub2
    # Real Bot API: GET /bot is 404 JSON. 200/301/302 matches DPI redirects.
    # Provider health-checks still use gstatic for general liveness.
    url: https://api.telegram.org/bot
    interval: 30
    timeout: 4000
    lazy: false
    max-failed-times: 1
    expected-status: 404
    exclude-filter: "(?i)expire|expiring|traffic|remain|剩余|流量|过期|官网|套餐|到期|重置|订阅"

  - name: WHITELIST
    type: select
    use:
      - sub4
      - sub5

  - name: PROXY
    type: select
    proxies:
      - AUTO
      - WHITELIST
      - DIRECT

rules:
  - MATCH,AUTO
