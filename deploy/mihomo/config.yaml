# Mihomo (Clash Meta) — headless client for Daily Stats bot.
# Copy to /etc/mihomo/config.yaml.
# Ports are offset from v2rayN defaults so both can run on the same host:
#   v2rayN  SOCKS/HTTP  10808 / 10809
#   mihomo  mixed       11808
#   mihomo  API         19090
#
# Apply (preferred): ./deploy.sh
# Install mihomo once (Arch): yay -S mihomo
#
# Add a VLESS/SS subscription: duplicate a subN block (name / url / path / prefix)
# and append it under AUTO.use. Do not put whitelist CIDR/SNI in AUTO.
#
# AUTO is fallback, not url-test: a failed dial to Telegram tries the next
# node immediately instead of waiting for a full url-test pass.
# First download uses DIRECT; if the subscription URL is blocked, save the YAML
# into path: once, later refreshes can use proxy: AUTO.

mixed-port: 11808
bind-address: 127.0.0.1
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
keep-alive-interval: 15
find-process-mode: off
geodata-mode: false
geo-auto-update: false
global-client-fingerprint: chrome

external-controller: 127.0.0.1:19090
secret: "8176598712630598761082765412765789012506456781928765078960"

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  nameserver:
    - 8.8.8.8
    - 1.1.1.1
  fallback:
    - tls://1.1.1.1
    - tls://8.8.8.8
  fallback-filter:
    geoip: false

proxy-providers:
  sub1:
    type: http
    url: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS.txt"  #Черные Списки VLESS / Все конфиги
    path: ./providers/sub1.yaml
    interval: 900 # раз в 15 мин 3600-час
    size-limit: 10485760
    proxy: DIRECT
    header:
      User-Agent:
        - "clash.meta"
        - "mihomo"
        - "clash-verge"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 120
      timeout: 4000
      lazy: false
      expected-status: 204
    override:
      additional-prefix: "s1 | "
      udp: true
    exclude-filter: "(?i)expire|expiring|traffic|remain|剩余|流量|过期|官网|套餐|到期|重置|订阅"

  sub2:
    type: http
    url: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_SS%2BAll_RUS.txt" #Черные Списки Shadowsocks+All / Все конфиги
    path: ./providers/sub2.yaml
    interval: 3600
    size-limit: 10485760
    proxy: AUTO
    header:
      User-Agent:
        - "clash.meta"
        - "mihomo"
